name: CI
on:
  push:
    branches: [main, work/consolidation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            database/full-database-design/package-lock.json
      - run: npm run setup
      - run: npm run check
      - run: npm run test
      - run: npm run build
      - run: npm run audit
  native-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-password
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm run setup
      - name: Use the service's matching PostgreSQL clients
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          for tool in ("pg_dump", "psql"):
              wrapper = Path(os.environ["RUNNER_TEMP"]) / ("lumavok-" + tool)
              wrapper.write_text('#!/bin/sh\nexec docker exec -i -e PGDATABASE "$LUMAVOK_POSTGRES_CONTAINER" ' + tool + ' "$@"\n')
              wrapper.chmod(0o700)
              with open(os.environ["GITHUB_ENV"], "a") as env:
                  env.write("LUMAVOK_" + tool.upper() + "=" + str(wrapper) + "\n")
          PY
      - run: npm --prefix database/full-database-design run test:native
        env:
          NODE_ENV: test
          LUMAVOK_ALLOW_DISPOSABLE_DATABASE: "1"
          LUMAVOK_NATIVE_TEST_URL: postgresql://postgres:disposable-ci-password@127.0.0.1:5432/postgres
          LUMAVOK_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mobile: ["0", "1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm run setup
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        env:
          CI: "true"
          E2E_MOBILE: ${{ matrix.mobile }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: playwright-${{ matrix.mobile }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build --file ${{ matrix.component }}/Dockerfile --tag lumavok-test:${{ matrix.component }} .
      - name: Smoke-test production runtime
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          if [[ "$COMPONENT" == backend ]]; then
            docker run --rm --entrypoint node lumavok-test:backend --input-type=module -e 'await import("sharp"); await import("@prisma/client");'
          else
            docker run --detach --name lumavok-web-check --publish 127.0.0.1:3000:3000 lumavok-test:frontend
            trap 'docker logs lumavok-web-check; docker rm --force lumavok-web-check' EXIT
            for attempt in {1..30}; do
              if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
              sleep 2
            done
            exit 1
          fi

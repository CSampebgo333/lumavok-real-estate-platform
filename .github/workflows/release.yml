name: Build approved release images
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit with successful CI
        required: true
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 25
    env:
      RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
      APPROVED_SHA: ${{ inputs.commit_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require successful CI for the exact commit
        shell: bash
        run: |
          [[ "$RELEASE_ENABLED" == true ]] || { echo "Release environment is not enabled"; exit 1; }
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$APPROVED_SHA&status=success" > "$RUNNER_TEMP/lumavok-ci.json"
          jq -e '.workflow_runs | any(.conclusion == "success" and .head_sha == env.APPROVED_SHA)' "$RUNNER_TEMP/lumavok-ci.json"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Build and publish immutable release candidates
        shell: bash
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          lumavok_image_repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          for component in frontend backend; do
            docker build --file "$component/Dockerfile" --tag "$lumavok_image_repo/$component:$APPROVED_SHA" .
            docker push "$lumavok_image_repo/$component:$APPROVED_SHA"
          done
          docker logout ghcr.io
